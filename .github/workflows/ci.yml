name: FinePrint CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Run Python Tests & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 30-Case Public Benchmark
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_30_case_benchmark.py -v

      - name: Run Full API & Integration Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_api_integration.py -v

  build-frontend:
    name: Build & Lint Next.js Cockpit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Lint
        working-directory: frontend
        run: npm run lint

      - name: Build Production Frontend
        working-directory: frontend
        run: npm run build
