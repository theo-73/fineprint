version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fineprint-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - PYTHONPATH=/app
    volumes:
      - fineprint-db:/app
      - ./uploaded_invoices:/app/uploaded_invoices
      - ./generated_packets:/app/generated_packets
    restart: unless-stopped

  frontend:
    image: node:18-alpine
    container_name: fineprint-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    command: sh -c "npm install && npm run build && npm run start"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fineprint-db:
